# Sveltia CMS configuration. Sign in at /studio-portal with a GitHub fine-grained token (see README).
backend:
  name: github
  repo: hizor636/hitesh-rao-portfolio
  branch: main

media_folder: assets/uploads
public_folder: assets/uploads
publish_mode: simple
site_url: https://hizor636.github.io/hitesh-rao-portfolio/
locale: en

collections:
  - name: site
    label: "Site, hero and contact"
    files:
      - name: site
        label: "Site text"
        file: content/site.json
        fields:
          - label: "Availability banner (leave empty to hide)"
            name: availability
            widget: string
            required: false
            hint: "Status banner text, e.g. 'Open to internships · Bengaluru'. Leave blank to hide."
          - label: Hero
            name: hero
            widget: object
            hint: "Top introductory section of the portfolio."
            fields:
              - { label: Kicker, name: kicker, widget: string, hint: "Role title or eyebrow kicker text, e.g. 'Tech Marketer & Data Builder'" }
              - { label: "Headline (put *stars* around the word to highlight)", name: headline, widget: string, hint: "Main hero statement. Words wrapped in *stars* are highlighted in italic serif." }
              - { label: "Lead paragraph", name: lead, widget: text, hint: "Primary intro paragraph describing your background and goals." }
              - label: "Key facts"
                name: facts
                widget: list
                label_singular: fact
                summary: "{{fields.value}} — {{fields.label}}"
                hint: "Proof stats in hero. You can add new metrics, delete items, and drag to reorder."
                fields:
                  - { label: Number, name: value, widget: string, hint: "Metric number or stat, e.g. '125K+' or '800+'" }
                  - { label: Label, name: label, widget: string, hint: "Short metric label, e.g. 'Google SA pool'" }
          - label: About
            name: about
            widget: object
            hint: "Core bio and personal statement."
            fields:
              - { label: Statement, name: statement, widget: text, hint: "High-level personal thesis or operating philosophy." }
              - { label: Paragraph, name: paragraph, widget: text, hint: "Detailed narrative bio about your studies and experience." }
          - label: Contact
            name: contact
            widget: object
            hint: "Public contact channels."
            fields:
              - { label: Email, name: email, widget: string, hint: "Contact email address" }
              - { label: "LinkedIn URL", name: linkedin, widget: string, hint: "Full LinkedIn profile URL" }
              - { label: "Behance URL", name: behance, widget: string, hint: "Behance portfolio URL" }
              - { label: "Instagram URL", name: instagram, widget: string, hint: "Instagram profile URL" }

  - name: projects
    label: "Work / projects"
    files:
      - name: projects
        label: "Project cards"
        file: content/projects.json
        fields:
          - label: Projects
            name: projects
            widget: list
            label_singular: project
            summary: "{{fields.index}} · {{fields.title}}"
            hint: "Case studies and portfolio cards. Supports adding, deleting, and dragging to reorder."
            fields:
              - { label: "Index (e.g. 00-1)", name: index, widget: string, hint: "Card index label, e.g. '00-1' or '01'" }
              - { label: Category, name: category, widget: select, options: [Career, Project, Skill], hint: "Category filter tag" }
              - { label: Title, name: title, widget: string, hint: "Project or case study headline" }
              - { label: "Kind (small label)", name: kind, widget: string, hint: "Short type label, e.g. 'Hackathon Ops' or 'Campus Program'" }
              - { label: Year, name: year, widget: string, hint: "Year or date period, e.g. '2026'" }
              - { label: "Big number or stat (optional)", name: stat, widget: string, required: false, hint: "Key metric number, e.g. '800+'" }
              - { label: "Stat label (optional)", name: stat_label, widget: string, required: false, hint: "Metric label, e.g. 'Event registrations'" }
              - { label: Description, name: description, widget: text, hint: "Summary of problem, scope, and technical outcome." }
              - label: Tags
                name: tags
                widget: list
                hint: "Domain/tool tags for this project. Add, remove, or reorder."
                field: { label: Tag, name: tag, widget: string, hint: "Skill or tool name, e.g. 'SQL' or 'Growth'" }
              - { label: "Recognition / dates line", name: recognition, widget: string, required: false, hint: "Recognition note, dates, or milestone citation." }
              - { label: "Cover colour (0-360)", name: hue, widget: number, value_type: int, min: 0, max: 360, default: 210, hint: "HSL hue degree (0=red, 120=green, 210=blue) for visual branding." }
              - { label: "Cover image (optional)", name: image, widget: image, required: false, hint: "Upload project visual to assets/uploads." }
              - { label: "Image alt text", name: image_alt, widget: string, required: false, hint: "Accessibility alt description for the cover image." }
              - { label: "Proof / case-study link (optional)", name: link_url, widget: string, required: false, hint: "Verified external URL (LinkedIn post, certificate, event page)." }
              - { label: "Link label", name: link_label, widget: string, required: false, hint: "Label on link button, e.g. 'View proof ↗'" }

  - name: highlights
    label: "Story highlights"
    files:
      - name: highlights
        label: "Highlights"
        file: content/highlights.json
        fields:
          - label: Highlights
            name: highlights
            widget: list
            label_singular: highlight
            summary: "{{fields.title}}"
            hint: "Story highlight circles. Add new categories, delete, or drag to reorder."
            fields:
              - { label: "ID (lowercase, no spaces)", name: id, widget: string, hint: "Unique category identifier, e.g. 'professional' or 'college'" }
              - { label: Title, name: title, widget: string, hint: "Category circle title, e.g. 'Professional'" }
              - { label: "Initials on the circle", name: initials, widget: string, hint: "1-2 uppercase letters shown when image is loading, e.g. 'PR'" }
              - { label: "Colour (0-360)", name: hue, widget: number, value_type: int, min: 0, max: 360, default: 210, hint: "HSL hue value for circle glow" }
              - { label: "Cover photo (optional)", name: cover, widget: image, required: false, hint: "Upload category circle photo to assets/uploads." }
              - { label: "Cover photo alt text", name: cover_alt, widget: string, required: false, hint: "Alt text describing the category cover photo." }
              - label: Slides
                name: slides
                widget: list
                label_singular: slide
                summary: "{{fields.title}}"
                hint: "Slides in this highlight. Add slides, delete, or drag to reorder."
                fields:
                  - { label: "Small label", name: kicker, widget: string, required: false, hint: "Top tag label on slide, e.g. 'Events & Ops'" }
                  - { label: "Big number (optional)", name: stat, widget: string, required: false, hint: "Stat number, e.g. '800+' or '2028'" }
                  - { label: Title, name: title, widget: string, required: false, hint: "Slide title" }
                  - { label: Text, name: text, widget: text, required: false, hint: "Detailed story narrative text." }
                  - { label: "Photo (optional)", name: img, widget: image, required: false, hint: "Upload slide photo to assets/uploads." }
                  - { label: "Photo alt text", name: alt, widget: string, required: false, hint: "Alt text describing the slide photo." }
                  - label: "Proof link (optional)"
                    name: link
                    widget: object
                    required: false
                    hint: "Verification button link on the slide."
                    fields:
                      - { label: URL, name: href, widget: string, required: false, hint: "Destination URL, e.g. LinkedIn proof post" }
                      - { label: "Button text", name: label, widget: string, required: false, hint: "Button text, e.g. 'View verification'" }

  - name: experience
    label: "Experience and skills"
    files:
      - name: experience
        label: "Timeline and skills"
        file: content/experience.json
        fields:
          - label: Timeline
            name: timeline
            widget: list
            label_singular: entry
            summary: "{{fields.role}} · {{fields.org}}"
            hint: "Chronological experience entries. Add new roles, delete, or drag to reorder."
            fields:
              - { label: Role, name: role, widget: string, hint: "Role title, e.g. 'Marketing Intern'" }
              - { label: "Organisation", name: org, widget: string, hint: "Company or institution, e.g. 'Paytm'" }
              - { label: Dates, name: dates, widget: string, hint: "Timeframe, e.g. 'Jun – Oct 2026'" }
          - label: "Skills columns"
            name: columns
            widget: list
            label_singular: column
            summary: "{{fields.title}}"
            hint: "Skill columns/clusters. Add columns, delete, or drag to reorder."
            fields:
              - { label: Title, name: title, widget: string, hint: "Column heading, e.g. 'Growth & Marketing'" }
              - label: Items
                name: items
                widget: list
                hint: "Skill list in this column. Add, delete, and reorder."
                field: { label: Item, name: item, widget: string, hint: "Skill name, e.g. 'SQL (PostgreSQL)'" }
