 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%4)*70+'ms';io.observe(e)})}
addEventListener('hashchange',route);route();
const clk=()=>$('#clk').textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false});clk();setInterval(clk,30000);

/* hover preview */
const pv=$('#pv');let lastR=null;
document.addEventListener('mousemove',e=>{if(!FINE)return;const r=e.target.closest&&e.target.closest('.row');
 if(r){if(r!==lastR){pv.innerHTML=cov(P.find(p=>p.i===r.dataset.id));lastR=r}pv.classList.add('on');pv.style.transform=`translate(${Math.min(e.clientX+24,innerWidth-310)}px,${Math.max(80,e.clientY-90)}px)`}else{pv.classList.remove('on');lastR=null}});

/* case dialog */
let opener=null;const close=()=>{const d=$('#mdl');if(d){d.remove();opener&&opener.focus()}};
addEventListener('keydown',e=>e.key==='Escape'&&close());
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-id]');if(b){opener=b;pv.classList.remove('on');const p=P.find(x=>x.i===b.dataset.id),d=document.createElement('div');d.id='mdl';d.className='fixed inset-0 z-[80] overflow-auto bg-black/85 backdrop-blur-md p-4 sm:p-6 md:p-10 flex justify-center items-start';
  d.innerHTML=`<div role="dialog" aria-modal="true" aria-label="${esc(p.t)}" class="w-full max-w-4xl my-auto p-6 md:p-10 border rounded-2xl text-left" style="background:var(--bg);border-color:var(--ln)"><div class="flex justify-between items-center mono mb-6 border-b pb-4" style="border-color:var(--ln)"><span class="mu">${p.i} · ${p.k}</span><button data-x class="px-3 py-1 rounded-full border border-white/20 hover:border-white/40" aria-label="Close case study">Close ✕</button></div>${cov(p).replace('aspect-ratio:4/3','min-height:200px')}<h2 class="text-3xl md:text-5xl tracking-tighter font-medium mt-8 text-white">${p.t}</h2><p class="mt-4 text-base mu leading-relaxed">${p.d}</p><div class="grid md:grid-cols-2 gap-8 mt-8 pt-6 border-t" style="border-color:var(--ln)"><div><p class="mono mu mb-3">Key Responsibilities</p><ul class="li text-base">${p.sv.map(s=>`<li>${s}</li>`).join('')}</ul></div><div><p class="mono mu mb-3">Verified Details</p><ul class="li text-base">${p.aw.map(s=>`<li>${s}</li>`).join('')}</ul></div></div></div>`;
  document.body.appendChild(d);d.querySelector('[data-x]').focus();d.addEventListener('click',ev=>{if(ev.target===d||ev.target.closest('[data-x]'))close()})}});
</script>
</body>
